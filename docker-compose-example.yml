version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: torox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torox_db
      POSTGRES_USER: torox_user
      POSTGRES_PASSWORD: torox_pass_2024
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torox_user -d torox_db']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torox_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: torox_db
      DATABASE_USER: torox_user
      DATABASE_PASSWORD: torox_pass_2024
      JWT_SECRET: torox_super_secret_jwt_key_2024_change_in_production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3001
      # ── Envia.com (envíos) ──────────────────────────────────────────────
      ENVIA_API_KEY: 721059fb9d29ca57c7f410a04643edd3cdae00f1024fe2003b62cbf45265d7ae
      ENVIA_API_BASE: https://api.envia.com
      ENVIA_CARRIERS: correoArgentino,andreani,oca
      ENVIA_ORIGIN_NAME: TOROX
      ENVIA_ORIGIN_COMPANY: TOROX
      ENVIA_ORIGIN_PHONE: '+54 9 11 7138-3512'
      ENVIA_ORIGIN_EMAIL: toroxseguridad@gmail.com
      ENVIA_ORIGIN_STREET: 'Bouchard 2092'
      ENVIA_ORIGIN_CITY: Lanus
      ENVIA_ORIGIN_STATE: BA
      ENVIA_ORIGIN_POSTAL_CODE: '1824'
    ports:
      - '3000:3000'
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: torox_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3000/api
      NUXT_PUBLIC_API_BASE_SERVER: http://backend:3000/api
    ports:
      - '3001:3000'

volumes:
  postgres_data:
  backend_uploads:
