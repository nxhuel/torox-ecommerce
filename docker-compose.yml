services:
  # ── Postgres local ────────────────────────────────────────────────────────
  # Crea automáticamente la base `torox_db` con el usuario `torox_user` la
  # primera vez que arranca (volumen `postgres_data`).
  postgres:
    image: postgres:16-alpine
    container_name: torox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torox_db
      POSTGRES_USER: torox_user
      POSTGRES_PASSWORD: torox_pass_2024
    # Conexión desde el host (DBeaver/psql) en localhost:5433
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torox_user -d torox_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torox_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # ── CONEXIÓN LOCAL (docker compose up --build -d) ──────────────────
      # OJO: TypeORM usa DATABASE_URL; estas variables sueltas son solo
      # documentación/referencia. DATABASE_URL manda.
      # DATABASE_URL: postgresql://torox_user:torox_pass_2024@postgres:5432/torox_db
      # DATABASE_HOST: postgres
      # DATABASE_PORT: 5432
      # DATABASE_NAME: torox_db
      # DATABASE_USER: torox_user
      # DATABASE_PASSWORD: torox_pass_2024
      # DATABASE_SSL: 'false'
      # JWT_SECRET: torox_super_secret_jwt_key_2024_change_in_production
      # JWT_EXPIRES_IN: 7d
      # FRONTEND_URL: http://localhost:3000
      # ── PRODUCCIÓN (Seenode Postgres) — para uso en producción ──────────
      # Descomentá este bloque y comentá el local de arriba.
      DATABASE_URL: postgresql://db_xfpxvqaunpi4:PSL8VFmwvKkA5AtreEyeZGkB@up-de-fra1-postgresql-3.db.run-on-seenode.com:11550/db_xfpxvqaunpi4
      DATABASE_HOST: up-de-fra1-postgresql-3.db.run-on-seenode.com
      DATABASE_PORT: 11550
      DATABASE_NAME: db_xfpxvqaunpi4
      DATABASE_USER: db_xfpxvqaunpi4
      DATABASE_PASSWORD: PSL8VFmwvKkA5AtreEyeZGkB
      DATABASE_SSL: 'true'
      JWT_SECRET: torox_super_secret_jwt_key_2024_change_in_production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://torox.com.ar
      # Cloudinary
      CLOUDINARY_CLOUD_NAME: hdidotfa
      CLOUDINARY_API_KEY: 172943417187796
      CLOUDINARY_API_SECRET: XpW_A6ETly-VxwQHcjea_on_Mbk
      RESEND_API_KEY: re_eghKDyoR_E6J2BGrpP1bQe2gmJ8aTv4vw
      MAIL_FROM: "TOROX <no-reply@torox.com.ar>"
      MAIL_REPLY_TO: toroxseguridad@gmail.com
      # ── Envia.com (envíos) ──────────────────────────────────────────────
      ENVIA_API_KEY: 721059fb9d29ca57c7f410a04643edd3cdae00f1024fe2003b62cbf45265d7ae
      ENVIA_API_BASE: https://api.envia.com
      ENVIA_QUERIES_BASE: https://queries.envia.com
      # Carriers a cotizar: "all" = todos los carriers disponibles en Argentina
      ENVIA_CARRIERS: all
      # Origen (retiro): Lanús, Buenos Aires
      ENVIA_ORIGIN_NAME: TOROX
      ENVIA_ORIGIN_COMPANY: TOROX
      ENVIA_ORIGIN_PHONE: '+54 9 11 7138-3512'
      ENVIA_ORIGIN_EMAIL: toroxseguridad@gmail.com
      ENVIA_ORIGIN_STREET: 'Bouchard 2092'
      ENVIA_ORIGIN_CITY: Lanus
      ENVIA_ORIGIN_STATE: BA
      ENVIA_ORIGIN_POSTAL_CODE: '1824'
      ENVIA_WEBHOOK_URL: https://torox-ecommerce.seenode.app/api/webhooks/envia
      # auth_token del webhook: firma HMAC de los webhooks de Envia (X-Webhook-Signature)
      ENVIA_WEBHOOK_SECRET: 791e5db67d0de43198928e012cac970148521801f7d7a5c0b2d632fc031974e1
    ports:
      - '3001:3001'
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # En local el navegador llama al backend en localhost:3001.
        # Para producción sobreescribí NUXT_PUBLIC_API_BASE (ej: https://torox-ecommerce.seenode.app/api).
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://torox-ecommerce.seenode.app/api}
        # NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3001/api}
    container_name: torox_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://torox-ecommerce.seenode.app/api}
      # NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:3001/api}
      # Llamadas server-side (SSR) dentro de la red de Docker:
      NUXT_PUBLIC_API_BASE_SERVER: ${NUXT_PUBLIC_API_BASE:-https://torox-ecommerce.seenode.app/api}
      # NUXT_PUBLIC_API_BASE_SERVER: http://backend:3001/api
    ports:
      - '3000:3000'

volumes:
  backend_uploads:
  postgres_data:
