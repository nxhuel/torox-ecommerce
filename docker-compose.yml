services:
  # ── Postgres local ────────────────────────────────────────────────────────
  # Crea automáticamente la base `torox_db` con el usuario `torox_user` la
  # primera vez que arranca (volumen `postgres_data`).
  postgres:
    image: postgres:16-alpine
    container_name: torox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torox_db
      POSTGRES_USER: torox_user
      POSTGRES_PASSWORD: torox_pass_2024
    # Conexión desde el host (DBeaver/psql) en localhost:5433
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U torox_user -d torox_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: torox_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Las credenciales (DB, JWT, Cloudinary, Resend, Envia) se leen del .env
    # de la raíz, que está en .gitignore. NO volver a escribirlas acá: este
    # archivo sí se sube al repositorio.
    # Orden de carga: primero .env y después docker-local.env (que pisa a .env).
    # docker-local.env deja todo en modo local: base del docker, Envia
    # sandbox y sin webhooks. Si no querés eso, comentá la segunda línea.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL del backend que usa el navegador. En local: localhost:3001.
        # (Usamos TOROX_API_BASE y no NUXT_PUBLIC_API_BASE para que el valor de
        # producción que hay en .env no se cuele en el build local.)
        NUXT_PUBLIC_API_BASE: ${TOROX_API_BASE:-http://localhost:3001/api}
    container_name: torox_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NUXT_PUBLIC_API_BASE: ${TOROX_API_BASE:-http://localhost:3001/api}
    ports:
      - '3000:3000'

volumes:
  backend_uploads:
  postgres_data:
